# Extraction map for the `make i18n-*` targets. Run pybabel from the repo root:
#   pybabel extract -F agri_i18n/babel.cfg --omit-header -o agri_i18n/messages.pot .
#
# Only services whose messages reach an end user are listed. stac-api and
# raster-api emit no hand-written strings, and gis-pipeline is an operator CLI
# whose English logs stay greppable.
[python: vector-api/src/**.py]
[python: process-api/processes/**.py]
[python: chatbot/overrides/backend/**.py]
