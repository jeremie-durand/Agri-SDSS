# Host-side pytest is scoped to agri_i18n, the only pure-stdlib package here.
#
# Every service is tested inside its own container via `make test-<service>`,
# because they run on different Python versions (vector-api 3.14, chatbot 3.12,
# process-api 3.11) and need GDAL, GEOS, PROJ and DuckDB natively. Without the
# testpaths restriction below, a bare `pytest` at the repo root tries to collect
# all of them and fails.
[pytest]
testpaths = agri_i18n/test
markers =
    unit: unit tests
    integration: integration tests
    mocked: tests with mocked external services
addopts = --import-mode=importlib
