config:
  # Prose, tables and URLs in docs are not held to the 88-char Python limit
  MD013: false
  # Repeated section names under different parents (e.g. "Usage") are fine
  MD025:
    front_matter_title: ""
  MD024:
    siblings_only: true
  # Docs embed <details>, <img> and anchor tags
  MD033: false
  # Some docs start with a badge or blockquote before the title
  MD041: false

globs:
  - "**/*.md"

ignores:
  - "node_modules"
  - "data"
  - "**/.pytest_cache"
  # Generated by `make generate-args`; CI checks it byte-for-byte
  - "gis-pipeline/docs/ARGS.md"
  # Session scratch, not tracked
  - "docs/superpowers"
