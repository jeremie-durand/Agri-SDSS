# See the matching block in frontend/home/scripts/entrypoint.sh — a global
# in-flight cap rather than a per-client one, because every request reaches
# this server through a proxy and so shares one address.
limit_conn_zone $server_name zone=chatbot_conn:1m;

server {
    listen 3001;

    root /usr/share/nginx/html;
    index index.html;

    # Slow-loris hardening (inactivity timeouts between successive reads).
    client_header_timeout 10s;
    client_body_timeout   15s;
    limit_conn_status     503;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https:; connect-src 'self' https: ws: wss:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend surface is /api/*, /sdss/* and three root-level JSON documents
    # (checked against its OpenAPI schema). Paths outside that set are not
    # proxied, so a bogus request is refused here rather than being handed a
    # 600s slot to reach a 404. This server is reachable only on the internal
    # network; public traffic goes through home nginx, which mirrors these
    # blocks. Keep the two in sync.

    # Static JSON documents — no LLM work, so no long timeout.
    location ~ ^/(pc_collections_metadata|pc_rendering_config|stac_collections)\.json$ {
        proxy_pass http://chatbot-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location ~ ^/(api|sdss)(/|$) {
        limit_conn chatbot_conn 24;
        proxy_pass http://chatbot-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # CPU-only local Ollama can take >120s for a single completion, and
        # one chat turn can chain several completions in the agent's tool
        # loop (observed ~325s total across 3 completions in production, on
        # top of process/STAC lookups) — 300s was sized for one completion
        # and isn't enough headroom for the full loop.
        # Concurrency is bounded by the Caddy chatbot_* zones and by
        # OLLAMA_NUM_PARALLEL / OLLAMA_MAX_QUEUE, not by this timeout.
        proxy_read_timeout 600s;
    }
}
