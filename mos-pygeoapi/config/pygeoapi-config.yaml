resources:
  hello-world-pygeoapi:
    type: process
    title: Hello World Process pygeoapi basic
    description: A simple process that returns a welcome message.
    processor:
      name: pygeoapi.process.hello_world.HelloWorldProcessor # basic pygeoapi process
  
  sentinel-fetch:
    type: process
    title: Sentinel-2 Earth Observation Data Fetch
    description: Fetches Sentinel-2 data from openEO backends for a farm polygon, calculates vegetation indices (NDVI, EVI, SAVI), and stores as Cloud Optimized GeoTIFF in STAC catalog
    processor:
      name: processes.eo_sentinel_fetch.SentinelFetchProcessor

server:
  bind:
    host: 0.0.0.0
    port: 5000
  url: http://localhost:5000
  mimetype: application/json
  encoding: utf-8
  language: en-US

logging:
  level: DEBUG
  logfile: /tmp/pygeoapi.log

manager:
  name: Dummy
  connection:
    subscribers:
      - in_progress_uri: http://localhost:5000/status/in-progress
        success_uri: http://localhost:5000/status/success
        failed_uri: http://localhost:5000/status/failed