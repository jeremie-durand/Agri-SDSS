name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

jobs:

  scan-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: '1'

  build-and-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build mos-chatbot-backend
        run: |
          VERSION=$(grep '^CHATBOT_VERSION=' .env.example | cut -d= -f2)
          docker build \
            --build-arg CHATBOT_VERSION="$VERSION" \
            --build-arg INCLUDE_OLLAMA=stub \
            --target runtime \
            -t mos-chatbot-backend \
            -f mos-chatbot/Dockerfile.mos-chatbot-backend \
            .

      - name: Build mos-chatbot-frontend
        run: |
          VERSION=$(grep '^CHATBOT_VERSION=' .env.example | cut -d= -f2)
          docker build \
            --build-arg CHATBOT_VERSION="$VERSION" \
            -t mos-chatbot-frontend \
            -f mos-chatbot/Dockerfile.mos-chatbot-frontend \
            .

      - name: Trivy CVE scan — backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mos-chatbot-backend
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy CVE scan — frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mos-chatbot-frontend
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate SBOM — backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mos-chatbot-backend
          format: cyclonedx
          output: sbom-mos-chatbot-backend.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-*.json

  verify-overrides:
    runs-on: ubuntu-latest
    needs: [build-and-scan]
    steps:
      - uses: actions/checkout@v7

      - name: Clone OpenGeo-AI-Assistant at pinned version
        run: |
          VERSION=$(grep '^CHATBOT_VERSION=' .env.example | cut -d= -f2)
          git clone --depth 1 --branch "$VERSION" \
            https://github.com/jeremie-durand/OpenGeo-AI-Assistant.git /tmp/chatbot

      - name: Verify backend override paths still exist upstream
        run: |
          UPSTREAM_ROOT=/tmp/chatbot/opengeo-ai-assistant/container-app
          for f in $(find mos-chatbot/overrides/backend -type f \
              | sed 's|mos-chatbot/overrides/backend/||'); do
            if [ -f "$UPSTREAM_ROOT/$f" ]; then
              echo "OK  override '$f' matches upstream path in container-app/"
            else
              echo "NEW override '$f' has no upstream counterpart in container-app/ (mos-gis-specific)"
            fi
          done
