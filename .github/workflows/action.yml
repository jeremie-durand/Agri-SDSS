name: Run Mocked API Tests

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      STAC_API_URL: "http://localhost:8081"
      RASTER_API_URL: "http://localhost:8082"
      VECTOR_API_URL: "http://localhost:8083"
      STAC_BROWSER_URL: "http://localhost:8085"
      PYGEOAPI_URL: "http://localhost:5000"
      DUCKDB_DATABASE: "/tmp/eoapi.duckdb"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stac-fastapi/requirements-stac-fastapi.txt

      - name: Run tests with mocked endpoints
        run: pytest -m mocked test/
