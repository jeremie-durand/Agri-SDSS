version: 2
updates:
  # ── pip: one entry per service, one PR per dependency update ──
  - package-ecosystem: "pip"
    directory: "/gis-pipeline/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Montreal"
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore"

  - package-ecosystem: "pip"
    directory: "/stac-api/"
    schedule:
