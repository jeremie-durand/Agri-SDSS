      member_id: "r1i1p1f1"
      date_range: "19500101-21001231"
    FGOALS-g3:
      institution: "CAS"
      member_id: "r1i1p1f1"
      date_range: "19500101-21001231"
    CanESM5:
      institution: "CCCma"
      member_id: "r1i1p1f1"
      date_range: "19500101-21001231"
    CMCC-ESM2:
      institution: "CMCC"
      member_id: "r1i1p1f1"
      date_range: "19500101-21001231"
    CNRM-CM6-1:
      institution: "CNRM-CERFACS"
